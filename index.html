<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 1: Basic HTML Forms | Assignment 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Assignment 4</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Part 1</a></li>
          <li class="nav-item"><a class="nav-link" href="part2.html">Part 2</a></li>
          <li class="nav-item"><a class="nav-link" href="part3.html">Part 3</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-8">

        <h2 class="fw-bold mb-4">Part 1. Basic HTML Form</h2>

        <!-- Native Form Container -->
        <div class="native-form">
          <form action="#" method="POST" id="contactForm">

            <!-- Name Input -->
            <div class="field-group">
              <label for="userName">Full Name <span class="text-danger">*</span></label>
              <input 
                type="text" 
                id="userName" 
                name="userName" 
                placeholder="Enter your full name" 
                required 
                minlength="2" 
                maxlength="50"
                pattern="^[A-Za-z\s]{2,50}$"
                title="Only letters and spaces are allowed (2-50 characters)"
              >
              <span class="field-hint">Required. Only letters and spaces (2-50 characters).</span>
            </div>

            <!-- Email Input -->
            <div class="field-group">
              <label for="userEmail">Email Address <span class="text-danger">*</span></label>
              <input 
                type="email" 
                id="userEmail" 
                name="userEmail" 
                placeholder="student@astanait.edu.kz" 
                required
              >
              <span class="field-hint">Must be a valid email containing '@'.</span>
            </div>

            <!-- Message Input -->
            <div class="field-group">
              <label for="userMessage">Message <span class="text-danger">*</span></label>
              <textarea 
                id="userMessage" 
                name="userMessage" 
                rows="5" 
                placeholder="Write your message here..." 
                required 
                minlength="10" 
                maxlength="500"
              ></textarea>
              <span class="field-hint">Minimum 10 characters, maximum 500 characters.</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary px-4">Submit</button>

          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p class="mb-0">Astana IT University &copy; 2026. Student: Berdalin Yerbol (IT-2513)</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
